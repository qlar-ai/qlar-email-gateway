name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The unit suite deliberately needs no mail server — IMAP, SMTP and Qlar are faked and
      # sleeps and the clock are injected. Installing only
      # [dev] here keeps that honest: if a test starts needing a driver, CI fails.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches a broken package before a release tag does.
      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Build Docker image
        run: docker build -t qlar-email-gateway:ci .
