name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "number=$TAG" >> "$GITHUB_OUTPUT"
          VERSION=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/qlar_email_gateway/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match __version__ $VERSION"; exit 1
          fi

      - name: Build distributions
        run: |
          pip install build
          python -m build

      # Published so that anyone installing this into their own network can verify what
      # they received. SECURITY.md tells them to.
      - name: Checksums
        run: |
          cd dist && sha256sum * > "qlar_email_gateway-${GITHUB_REF_NAME#v}.sha256" && cat *.sha256

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image lives under this repository's own org: GITHUB_TOKEN cannot push to another
      # org's registry ("permission_denied: The requested installation does not exist").
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/qlar-ai/email-gateway:${{ steps.version.outputs.number }}
            ghcr.io/qlar-ai/email-gateway:latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
